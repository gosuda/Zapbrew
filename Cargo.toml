[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "BSD-2-Clause"

[workspace.dependencies]
anyhow = "1.0.104"
assert_cmd = "2.2.2"
base64 = "0.23.0"
bzip2 = "0.6.1"
camino = "1.2.5"
clap = { version = "4.6.5", features = ["derive"] }
clap_complete = "4.6.8"
flate2 = "1.1.9"
futures = "0.3.33"
indicatif = "0.18.6"
insta = "1.48.0"
jaro_winkler = "0.2.1" # replaces stale strsim for did-you-mean scoring
jiff = "0.2.35"
lzma-rust2 = "0.18.0"
object = { version = "0.40.0", features = ["read", "write", "elf", "macho"] }
owo-colors = "4.3.0"
plist = { version = "1.10.0", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "gzip", "brotli", "zstd", "stream", "json"] }
rsa = { version = "0.9.10", features = ["sha2"] }
rustix = { version = "1.1.4", features = ["fs"] }
ruzstd = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
terminal_size = "0.4.4"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "fs", "process", "signal", "macros", "io-util", "time"] }
wiremock = "0.6.5"
zip = "8.6.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
