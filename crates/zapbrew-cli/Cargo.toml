[package]
name = "zapbrew-cli"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "zapbrew"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
zapbrew-api = { path = "../zapbrew-api" }
zapbrew-ops = { path = "../zapbrew-ops" }
zapbrew-prefix = { path = "../zapbrew-prefix" }

anyhow = { workspace = true }
camino = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
jaro_winkler = { workspace = true }
owo-colors = { workspace = true }
reqwest = { workspace = true }
terminal_size = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
# Resolver-3 feature unification: `cargo test -p zapbrew-cli` rebuilds the
# `zapbrew` bin with the API's test trust root, so assert_cmd traverses the real
# JWS verifier over a checked-in fixture. `cargo build`/release/install ignore
# dev-dependencies, so the production trust root ships unchanged.
zapbrew-api = { path = "../zapbrew-api", features = ["test-trust-root"] }
assert_cmd = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
