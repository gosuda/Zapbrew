[package]
name = "zapbrew-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

# Nondefault: swaps ONLY the compile-time JWS trust anchor to a checked-in test
# root so integration tests can traverse the real PS512/RFC7797 verifier over a
# fixture. Never enabled in the normal/build/release/install graph.
[features]
test-trust-root = []

[dependencies]
zapbrew-prefix = { path = "../zapbrew-prefix" }
zapbrew-types = { path = "../zapbrew-types" }
base64 = { workspace = true }
camino = { workspace = true }
jaro_winkler = { workspace = true }
jiff = { workspace = true }
reqwest = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
